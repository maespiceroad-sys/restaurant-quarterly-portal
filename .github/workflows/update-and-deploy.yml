name: Update and Deploy Portal

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: restaurant-quarterly-portal-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Verify collection and scheduling logic
        run: npm test

      - name: Restore hosted PDFs
        uses: actions/cache@v4
        with:
          path: site/assets/pdfs
          key: restaurant-pdfs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: restaurant-pdfs-

      - name: Update portal data
        id: collection
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAX_REPORTS_PER_COMPANY: ${{ secrets.MAX_REPORTS_PER_COMPANY }}
          REPORT_NOTIFY_ALWAYS: "false"
          DOWNLOAD_PDFS: "true"
          EVENT_NAME: ${{ github.event_name }}
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            npm run update -- --if-due
          else
            npm run update
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.js data/manifest.json logs/latest-run.json
          if git diff --cached --quiet; then
            echo "No tracked data changes to commit."
          else
            git commit -m "chore: refresh portal data"
            git push
          fi

      - name: Upload Pages artifact
        if: steps.collection.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Check collection and mail delivery
        if: steps.collection.outcome == 'failure'
        run: |
          echo "Collection or mail delivery failed. Previous data and any pending notifications are retained."
          exit 1

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
